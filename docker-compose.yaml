services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      # Loopback only: the analytics database must not be reachable from the LAN.
      - "127.0.0.1:5432:5432"
    volumes:
      - seismic-postgres:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  minio:
    # Upstream MinIO was archived in 2026 and its images removed from Docker
    # Hub and Quay; Silo is a drop-in MinIO-compatible fork with per-version
    # tags. Same pin Ledgerline runs.
    image: pgsty/silo:RELEASE.2026-09-16T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes: [minio-data:/data]

  minio-init:
    image: python:3.12-slim
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-ec"]
    environment:
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      SEISMIC_BUCKET: ${SEISMIC_BUCKET:-seismic-raw}
    volumes:
      - ./infra/minio/init-bucket.py:/init-bucket.py:ro
    command:
      - pip install --quiet --disable-pip-version-check minio==7.2.20 && python /init-bucket.py
    restart: "no"

  airflow-standalone:
    build: .
    command: standalone
    depends_on:
      airflow-db:
        condition: service_healthy
      postgres:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?set AIRFLOW_FERNET_KEY in .env}
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in .env}
      S3_ENDPOINT_URL: http://minio:9000
      SEISMIC_BUCKET: ${SEISMIC_BUCKET:-seismic-raw}
      USGS_BASE_URL: ${USGS_BASE_URL:-https://earthquake.usgs.gov/fdsnws/event/1/query}
      SEISMIC_H3_RESOLUTION: ${SEISMIC_H3_RESOLUTION:-5}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      # CLI-based check: succeeds once the metadata DB is migrated and Airflow
      # is usable. Version-agnostic across Airflow 2 and 3, unlike HTTP probes.
      test: ["CMD-SHELL", "airflow dags list >/dev/null 2>&1"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    volumes:
      - ./dags:/opt/airflow/dags
      - ./dbt:/opt/airflow/dbt
      - airflow-logs:/opt/airflow/logs

  metabase:
    image: metabase/metabase:v0.50.22
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  seismic-postgres:
  minio-data:
  airflow-logs:
