name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install h3==4.1.2 ruff==0.9.10
      - run: ruff check dags/seismic_contract.py tests
      - run: python -m unittest discover -s tests -v
