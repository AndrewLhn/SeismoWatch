name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements-dev.txt
      - name: Compose file interpolates
        run: |
          cp .env.example .env
          docker compose config --quiet
      - run: python -m compileall -q dags tests infra
      - name: Unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -s tests -v
          python -m coverage report --include="dags/*" --skip-empty
      - name: Lint
        run: ruff check dags tests infra
      - name: dbt manifest parses (refs, sources, and tests resolve)
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        run: dbt parse --project-dir dbt --profiles-dir dbt
